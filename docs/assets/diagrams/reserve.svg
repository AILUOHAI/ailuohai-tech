<text x="30.0" y="585.0" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="start" fill="#3A4652" font-weight="normal" xml:space="preserve">Резерв - воздуха больше, чем надо для цели; лишнее съедает поздний УОЗ. Нужен момент - УОЗ возвращается к оптимальному за один цикл,</text>
<text x="30.0" y="603.0" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="start" fill="#3A4652" font-weight="normal" xml:space="preserve">дроссель и коллектор не ждём. Сейчас - только резерв ХХ (подхват при нагрузке на холостом). Из резервов берётся больший; в MED9 он ограничен</text>
<text x="30.0" y="621.0" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="start" fill="#3A4652" font-weight="normal" xml:space="preserve">кривой по оборотам (KLDMMX) и тем, что может съесть самый поздний УОЗ, - иначе резерв поднимал бы фактический момент.</text>
</svg>