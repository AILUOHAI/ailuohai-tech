<text x="30.0" y="450.0" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="start" fill="#3A4652" font-weight="normal" xml:space="preserve">Насос качает остаток хода плунжера после закрытия клапана; клапан держит давление сам - импульс PT2001 короткий.</text>
<text x="30.0" y="466.0" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="start" fill="#3A4652" font-weight="normal" xml:space="preserve">Несколько насосов на одну рампу делят подачу долями: P и I - по общему давлению, утечка - своя у насоса.</text>
<text x="30.0" y="482.0" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="start" fill="#3A4652" font-weight="normal" xml:space="preserve">Датчик рампы недостоверен - насос выключен, впрыск на давлении подкачки, код неисправности.</text>
