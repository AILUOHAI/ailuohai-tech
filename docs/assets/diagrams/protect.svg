<text x="1336.0" y="314.0" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#3C9D4E" font-weight="600" xml:space="preserve">«домой»: лампа + предел оборотов lim.limpRpm</text>
<text x="30.0" y="400.0" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="start" fill="#3A4652" font-weight="normal" xml:space="preserve">1. Четыре ступени: чем хуже величина, тем меньше доля момента. Нижняя ступень - «домой», не ноль. Давление масла: величина - доля от наименьшего давления на этих оборотах.</text>
<text x="30.0" y="416.0" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="start" fill="#3A4652" font-weight="normal" xml:space="preserve">2. Короткий выброс датчика ничего не режет (время подтверждения); снижение плавное - винт не дёргает; возврат медленный - мотор успевает остыть.</text>
<text x="30.0" y="432.0" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="start" fill="#3A4652" font-weight="normal" xml:space="preserve">3. Из всех причин действует самая строгая; доля умножается на то, что мотор может сейчас - получается один предел момента для всего блока.</text>
</svg>