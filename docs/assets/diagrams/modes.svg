<text x="1122.0" y="152.0" font-family="Segoe UI, Arial, sans-serif" font-size="14" text-anchor="start" fill="#3C9D4E" font-weight="700" xml:space="preserve">Работа</text>
<text x="1084.0" y="180.0" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="start" fill="#2B3A48" font-weight="normal" xml:space="preserve">моментная структура:</text>
<text x="1084.0" y="195.0" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="start" fill="#2B3A48" font-weight="normal" xml:space="preserve">ХХ, частичная,</text>
<text x="1084.0" y="210.0" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="start" fill="#2B3A48" font-weight="normal" xml:space="preserve">полная нагрузка</text>
