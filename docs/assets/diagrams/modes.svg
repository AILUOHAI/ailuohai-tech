<text x="1382.0" y="152.0" font-family="Segoe UI, Arial, sans-serif" font-size="14" text-anchor="start" fill="#7A4FC2" font-weight="700" xml:space="preserve">Останов</text>
<text x="1344.0" y="180.0" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="start" fill="#2B3A48" font-weight="normal" xml:space="preserve">искра и впрыск</text>
<text x="1344.0" y="195.0" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="start" fill="#2B3A48" font-weight="normal" xml:space="preserve">сняты сразу,</text>
<text x="1344.0" y="210.0" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="start" fill="#2B3A48" font-weight="normal" xml:space="preserve">ждём остановки вала</text>
<text x="226.0" y="165.0" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="start" fill="#3A4652" font-weight="normal" xml:space="preserve">ключ</text>
<text x="486.0" y="165.0" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="start" fill="#3A4652" font-weight="normal" xml:space="preserve">вращение</text>
<text x="746.0" y="165.0" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="start" fill="#3A4652" font-weight="normal" xml:space="preserve">завёлся</text>
<text x="1006.0" y="165.0" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="start" fill="#3A4652" font-weight="normal" xml:space="preserve">добавка</text>
<text x="1006.0" y="194.0" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="start" fill="#3A4652" font-weight="normal" xml:space="preserve">ушла</text>
<text x="1266.0" y="165.0" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="start" fill="#3A4652" font-weight="normal" xml:space="preserve">заглох,</text>
<text x="1266.0" y="194.0" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="start" fill="#3A4652" font-weight="normal" xml:space="preserve">ключ, R3</text>
<text x="30.0" y="430.0" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="start" fill="#3A4652" font-weight="normal" xml:space="preserve">Сбой синхронизации - не «заглох»: режим держится surv.syncLost, пока декодер находит колесо заново (лодка далеко от берега). Ключ снят или авария R3 - «Останов» из любого режима.</text>
