<text x="30.0" y="540.0" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="start" fill="#3A4652" font-weight="normal" xml:space="preserve">Откат ограничивает угол сверху: базовый − откат. Моментная модель видит меньший КПД зажигания, и воздух плавно добирает момент - без провала.</text>
<text x="30.0" y="556.0" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="start" fill="#3A4652" font-weight="normal" xml:space="preserve">Октан k: 0 - карта «92» (безопасная, knock.ign92), 1 - «100» (tq.ignBase); вниз быстро при откатах, вверх медленно, после заправки - к knock.octStart.</text>
<text x="30.0" y="572.0" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="start" fill="#3A4652" font-weight="normal" xml:space="preserve">Цилиндры не отключаются; аварийная отсечка (coord.emergencyCut) по умолчанию выключена.</text>
